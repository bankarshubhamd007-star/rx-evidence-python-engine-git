[project]
name = "rx-evidence-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "binoymanoj", email = "binoy@drstore.in" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "uvicorn[standard]>=0.52.2",
    "chromadb>=1.0.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.9.0",
    "openai>=1.82.0",
    "json-repair>=0.63.3",
    "ddgs>=9.15.0",
    "cachetools>=7.1.7",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
    "nltk>=3.9",
    "motor>=3.7.1",
    "bcrypt>=4.2.0",
    "pyjwt>=2.10.0",
    "email-validator>=2.2.0",
]

[project.scripts]
rx-evidence-engine = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mongomock-motor>=0.0.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
